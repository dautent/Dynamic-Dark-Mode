name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.5.2

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.2

      - name: Install dependencies
        run: |
          pod install

      - name: Build
        run: |
          xcodebuild \
            -workspace "Dynamic Dark Mode.xcworkspace" \
            -scheme "Dynamic Dark Mode" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/Dynamic Dark Mode.app" \
            "Dynamic-Dark-Mode.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Dark-Mode
          path: Dynamic-Dark-Mode.zip